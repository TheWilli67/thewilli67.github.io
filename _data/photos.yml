# Titres et descriptions des photos de la galerie (page photographie.html).
#
# AJOUTER UNE PHOTO : déposer l'original dans _photos/, puis lancer
#   python .github/scripts/photos.py
# (métadonnées retirées, versions WebP créées dans assets/photos/, dimensions écrites dans
# _data/galerie.json). Sans cette étape, l'Action « Publication du site » s'en charge au
# prochain push : faire ensuite un Pull avant de pousser à nouveau.
#
# Sans entrée dans ce fichier, le titre est déduit du nom du fichier :
#   « Coucher de soleil.jpg »  →  « Coucher de soleil »
#   « IMG_1234.JPG »           →  pas de titre (nom d'appareil photo)
#
# Pour personnaliser une photo, ajouter une entrée avec le nom EXACT du fichier.
# Toutes les clés sont facultatives ; les versions *_en s'affichent quand le site est
# en anglais (à défaut, la version française est utilisée).
#   title / title_en : titre
#   tags  / tags_en  : petite ligne sous le titre (ex. « Faune · Nature »)
#   desc  / desc_en  : description affichée dans la visionneuse
#   alt   / alt_en   : texte alternatif (accessibilité)
#
# L'ordre de ce fichier est l'ordre d'affichage. Les photos sans entrée s'affichent
# ensuite, par ordre alphabétique de nom de fichier.

