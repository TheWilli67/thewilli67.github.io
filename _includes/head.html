{%- comment -%}
  Début du <head> commun à toutes les pages : méta-données, aperçu de partage (Open Graph),
  polices, feuille de style et scripts communs. Chaque page ajoute ensuite sa balise <style>.
  Variables lues dans le front matter de la page :
    title       : titre affiché après « William Hertrich — » (onglet) et « William Hertrich · » (partage)
    description : texte pour les moteurs de recherche et l'aperçu de partage
    lang        : facultatif, « en » pour une page rédigée en anglais
{%- endcomment -%}
{%- assign site_url = "https://thewilli67.github.io" -%}
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ site_url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="William Hertrich">
  <meta property="og:title" content="William Hertrich · {{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ site_url }}{{ page.url }}">
  <meta property="og:image" content="{{ site_url }}/Images_photos/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="William Hertrich, Ingénieur Systèmes &amp; Réseaux">
  {%- if page.lang == "en" %}
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="fr_FR">
  {%- else %}
  <meta property="og:locale" content="fr_FR">
  <meta property="og:locale:alternate" content="en_GB">
  {%- endif %}
  <meta name="twitter:card" content="summary_large_image">
  <title>William Hertrich — {{ page.title | escape }}</title>
  <link rel="icon" href="/Images_photos/reprendre.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/scripts/i18n.js" defer></script>
  <script src="/scripts/animation_page.js" defer></script>
  <script src="/scripts/reveal.js" defer></script>
  <noscript><style>body{opacity:1!important}.reveal{opacity:1!important;transform:none!important}</style></noscript>
